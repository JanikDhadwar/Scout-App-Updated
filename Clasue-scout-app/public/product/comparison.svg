<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img"><title>Team comparison</title><desc>Illustrative comparison of three teams with match medians, sample sizes and coverage, plus an alliance picklist.</desc><g font-family="Segoe UI,system-ui,sans-serif"><rect x="1" y="1" width="1118" height="678" rx="8" fill="#0b1018" stroke="#2c3a4e"/><rect x="1" y="1" width="186" height="678" rx="8" fill="#101722" stroke="#2c3a4e"/><text x="25" y="49" fill="#f2f5fa" font-size="29" font-weight="700">Argus</text><text x="25" y="78" fill="#a7b5c8" font-size="13" font-weight="400">Sample workspace</text><rect x="13" y="117" width="160" height="40" rx="5" fill="#c53645" stroke="#c53645"/><text x="28" y="143" fill="#f2f5fa" font-size="14" font-weight="400">Dashboard</text><rect x="13" y="165" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="191" fill="#f2f5fa" font-size="14" font-weight="400">Assignments</text><rect x="13" y="213" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="239" fill="#f2f5fa" font-size="14" font-weight="400">Match scouting</text><rect x="13" y="261" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="287" fill="#f2f5fa" font-size="14" font-weight="400">Teams</text><rect x="13" y="309" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="335" fill="#f2f5fa" font-size="14" font-weight="400">Analytics</text><rect x="13" y="357" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="383" fill="#f2f5fa" font-size="14" font-weight="400">Alliance picklist</text><rect x="13" y="405" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="431" fill="#f2f5fa" font-size="14" font-weight="400">Pit display</text><text x="25" y="636" fill="#a7b5c8" font-size="13" font-weight="400">FRC scouting</text><text x="214" y="41" fill="#a7b5c8" font-size="14" font-weight="400">