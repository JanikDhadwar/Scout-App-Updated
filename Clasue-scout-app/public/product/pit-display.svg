<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img"><title>Pit display</title><desc>Illustrative pit display showing a match schedule and scouting reminders for a team.</desc><g font-family="Segoe UI,system-ui,sans-serif"><rect x="1" y="1" width="1118" height="678" rx="8" fill="#0b1018" stroke="#2c3a4e"/><rect x="1" y="1" width="186" height="678" rx="8" fill="#101722" stroke="#2c3a4e"/><text x="25" y="49" fill="#f2f5fa" font-size="29" font-weight="700">Argus</text><text x="25" y="78" fill="#a7b5c8" font-size="13" font-weight="400">Sample workspace</text><rect x="13" y="117" width="160" height="40" rx="5" fill="#c53645" stroke="#c53645"/><text x="28" y="143" fill="#f2f5fa" font-size="14" font-weight="400">Dashboard</text><rect x="13" y="165" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="191" fill="#f2f5fa" font-size="14" font-weight="400">Assignments</text><rect x="13" y="213" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="239" fill="#f2f5fa" font-size="14" font-weight="400">Match scouting</text><rect x="13" y="261" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="287" fill="#f2f5fa" font-size="14" font-weight="400">Teams</text><rect x="13" y="309" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="335" fill="#f2f5fa" font-size="14" font-weight="400">Analytics</text><rect x="13" y="357" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="383" fill="#f2f5fa" font-size="14" font-weight="400">Alliance picklist</text><rect x="13" y="405" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="431" fill="#f2f5fa" font-size="14" font-weight="400">Pit display</text><text x="25" y="636" fill="#a7b5c8" font-size="13" font-weight="400">FRC scouting</text><text x="214" y="41" fill="#a7b5c8" font-size="14" font-weight="400">Sample invitational / Pit display</text><path d="M187 65h932" stroke="#2c3a4e"/><text x="214" y="111" fill="#f2f5fa" font-size="30" font-weight="650">Keep the pit in the loop</text><text x="214" y="140" fill="#a7b5c8" font-size="16" font-weight="400">Put the event schedule where your team can see it.</text><rect x="214" y="174" width="876" height="233" rx="8" fill="#151d29" stroke="#2c3a4e"/><text x="242" y="213" fill="#a7b5c8" font-size="16" font-weight="400">Next match</text><text x="242" y="268" fill="#f2f5fa" font-size="39" font-weight="650">Qualification 12</text><rect x="242" y="294" width="390" height="86" rx="5" fill="#6b2630" stroke="#6b2630"/><text x="262" y="323" fill="#f2f5fa" font-size="16" font-weight="400">Red alliance</text><text x="262" y="357" fill="#f2f5fa" font-size="24" font-weight="600">1001   1002   1003</text><rect x="658" y="294" width="390" height="86" rx="5" fill="#1e386d" stroke="#1e386d"/><text x="678" y="323" fill="#f2f5fa" font-size="16" font-weight="400">Blue alliance</text><text x="678" y="357" fill="#f2f5fa" font-size="24" font-weight="600">1004   1005   1006</text><rect x="214" y="431" width="876" height="174" rx="8" fill="#151d29" stroke="#2c3a4e"/><text x="242" y="469" fill="#f2f5fa" font-size="20" font-weight="600">Event planning, beyond the scouting seat</text><text x="242" y="510" fill="#a7b5c8" font-size="17" font-weight="400">Share team findings with presentations and exports.</text><text x="242" y="547" fill="#a7b5c8" font-size="17" font-weight="400">Review the schedule and assigned scouting responsibilities.</text><text x="242" y="582" fill="#a7b5c8" font-size="14" font-weight="400">Display example uses a downloaded schedule, not a live field feed.</text><text x="214" y="650" fill="#a7b5c8" font-size="13" font-weight="400">Illustrative preview · Sample data, not competition results</text></g></svg>