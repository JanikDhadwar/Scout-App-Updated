<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img"><title>Match scouting</title><desc>Illustrative match scouting form with team and match context, numeric fields, and pending offline upload status.</desc><g font-family="Segoe UI,system-ui,sans-serif"><rect x="1" y="1" width="1118" height="678" rx="8" fill="#0b1018" stroke="#2c3a4e"/><rect x="1" y="1" width="186" height="678" rx="8" fill="#101722" stroke="#2c3a4e"/><text x="25" y="49" fill="#f2f5fa" font-size="29" font-weight="700">Argus</text><text x="25" y="78" fill="#a7b5c8" font-size="13" font-weight="400">Sample workspace</text><rect x="13" y="117" width="160" height="40" rx="5" fill="#c53645" stroke="#c53645"/><text x="28" y="143" fill="#f2f5fa" font-size="14" font-weight="400">Dashboard</text><rect x="13" y="165" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="191" fill="#f2f5fa" font-size="14" font-weight="400">Assignments</text><rect x="13" y="213" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="239" fill="#f2f5fa" font-size="14" font-weight="400">Match scouting</text><rect x="13" y="261" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="287" fill="#f2f5fa" font-size="14" font-weight="400">Teams</text><rect x="13" y="309" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="335" fill="#f2f5fa" font-size="14" font-weight="400">Analytics</text><rect x="13" y="357" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="383" fill="#f2f5fa" font-size="14" font-weight="400">Alliance picklist</text><rect x="13" y="405" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="431" fill="#f2f5fa" font-size="14" font-weight="400">Pit display</text><text x="25" y="636" fill="#a7b5c8" font-size="13" font-weight="400">FRC scouting</text><text x="214" y="41" fill="#a7b5c8" font-size="14" font-weight="400">Sample invitational / Match scouting</text><path d="M187 65h932" stroke="#2c3a4e"/><text x="214" y="111" fill="#f2f5fa" font-size="30" font-weight="650">Capture what happened</text><text x="214" y="140" fill="#a7b5c8" font-size="16" font-weight="400">Match context stays attached to the report.</text><rect x="214" y="173" width="420" height="432" rx="8" fill="#151d29" stroke="#2c3a4e"/><text x="240" y="210" fill="#f2f5fa" font-size="24" font-weight="650">Match scouting</text><text x="240" y="244" fill="#ffb3bb" font-size="16" font-weight="400">Team 1001 · QM 12 · Red alliance</text><text x="240" y="282" fill="#f2f5fa" font-size="15" font-weight="400">Autonomous pieces</text><rect x="240" y="296" width="368" height="52" rx="8" fill="#0b1018" stroke="#2c3a4e"/><text x="259" y="330" fill="#f2f5fa" font-size="21" font-weight="400">4</text><text x="240" y="379" fill="#f2f5fa" font-size="15" font-weight="400">Teleoperated pieces</text><rect x="240" y="393" width="368" height="52" rx="8" fill="#0b1018" stroke="#2c3a4e"/><text x="259" y="427" fill="#f2f5fa" font-size="21" font-weight="400">12</text><text x="240" y="475" fill="#f2f5fa" font-size="15" font-weight="400">Climbed</text><rect x="240" y="490" width="175" height="44" rx="8" fill="#1c2736" stroke="#2c3a4e"/><text x="310" y="518" fill="#f2f5fa" font-size="16" font-weight="400">Yes</text><rect x="430" y="490" width="178" height="44" rx="8" fill="#0b1018" stroke="#2c3a4e"/><text x="503" y="518" fill="#f2f5fa" font-size="16" font-weight="400">No</text><rect x="240" y="550" width="368" height="38" rx="5" fill="#c53645" stroke="#c53645"/><text x="334" y="575" fill="#f2f5fa" font-size="14" font-weight="600">Submit scouting report</text><text x="680" y="227" fill="#f2f5fa" font-size="22" font-weight="600">Prepared for the stands</text><text x="680" y="265" fill="#a7b5c8" font-size="17" font-weight="400">Your forms and assignments,</text><text x="680" y="292" fill="#a7b5c8" font-size="17" font-weight="400">ready on your device