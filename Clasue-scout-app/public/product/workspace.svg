<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img"><title>Dashboard</title><desc>Illustrative dashboard with a next match, red and blue alliances, upcoming matches, and scouting responsibilities.</desc><g font-family="Segoe UI,system-ui,sans-serif"><rect x="1" y="1" width="1118" height="678" rx="8" fill="#0b1018" stroke="#2c3a4e"/><rect x="1" y="1" width="186" height="678" rx="8" fill="#101722" stroke="#2c3a4e"/><text x="25" y="49" fill="#f2f5fa" font-size="29" font-weight="700">Argus</text><text x="25" y="78" fill="#a7b5c8" font-size="13" font-weight="400">Sample workspace</text><rect x="13" y="117" width="160" height="40" rx="5" fill="#c53645" stroke="#c53645"/><text x="28" y="143" fill="#f2f5fa" font-size="14" font-weight="400">Dashboard</text><rect x="13" y="165" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="191" fill="#f2f5fa" font-size="14" font-weight="400">Assignments</text><rect x="13" y="213" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="239" fill="#f2f5fa" font-size="14" font-weight="400">Match scouting</text><rect x="13" y="261" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="287" fill="#f2f5fa" font-size="14" font-weight="400">Teams</text><rect x="13" y="309" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="335" fill="#f2f5fa" font-size="14" font-weight="400">Analytics</text><rect x="13" y="357" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="383" fill="#f2f5fa" font-size="14" font-weight="400">Alliance picklist</text><rect x="13" y="405" width="160" height="40" rx="5" fill="#101722" stroke="#101722"/><text x="28" y="431" fill="#f2f5fa" font-size="14" font-weight="400">Pit display</text><text x="25" y="636" fill="#a7b5c8" font-size="13" font-weight="400">FRC scouting</text><text x="214" y="41" fill="#a7b5c8" font-size="14" font-weight="400">Sample invitational / Dashboard</text><path d="M187 65h932" stroke="#2c3a4e"/><text x="214" y="111" fill="#f2f5fa" font-size="30" font-weight="650">Your event, in one workspace</text><text x="214" y="140" fill="#a7b5c8" font-size="16" font-weight="400">Know what is next. Keep your scouts moving.</text><rect x="214" y="172" width="510" height="228" rx="8" fill="#151d29" stroke="#2c3a4e"/><text x="236" y="205" fill="#a7b5c8" font-size="14" font-weight="400">Next assigned match</text><text x="236" y="240" fill="#f2f5fa" font-size="24" font-weight="650">Qualification 12</text><rect x="236" y="262" width="228" height="62" rx="5" fill="#6b2630" stroke="#6b2630"/><text x="250" y="283" fill="#f2f5fa" font-size="12" font-weight="400">Red alliance</text><text x="250" y="309" fill="#f2f5fa" font-size="17" font-weight="600">1001   1002   1003</text><rect x="472" y="262" width="228" height="62" rx="5" fill="#1e386d" stroke="#1e386d"/><text x="486" y="283" fill="#f2f5fa" font-size="12" font-weight="400">Blue alliance</text><text x="486" y="309" fill="#f2f5fa" font-size="17" font-weight="600">1004   1005   1006</text><rect x="236" y="342" width="466" height="40" rx="5" fill="#c53645" stroke="#c53645"/><text x="382" y="368" fill="#f2f5fa" font-size="15" font-weight="600">Start match scouting</text><rect x="744" y="172" width="346" height="228" rx="8" fill="#151d29" stroke="#2c3a4e"/><text x="766" y="207" fill="#f2f5fa" font-size="18" font-weight="600">Your assigned teams</text><text x="766" y="239" fill="#a7b5c8" font-size="14" font-weight="400">Keep the same teams all event.</text><path d="M766 260h300" stroke="#2c3a4e"/><text x="766" y="291" fill="#f2f5fa" font-size="21" font-weight="600">1001</text><text x="850" y="288" fill="#a7b5c8" font-size="14" font-weight="400">Pit + every match</text><path d="M766 315h300" stroke="#2c3a4e"/><text x="766" y="346" fill="#f2f5fa" font-size="21" font-weight="600">1004</text><text x="850" y="343" fill="#a7b5c8" font-size="14" font-weight="400">Pit